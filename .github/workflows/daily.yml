name: Ranking aktualisieren

# Bewusst KEIN push-Auslöser: ein Fußball-Lauf holt rund 3.500 Tabellen und
# dauert etwa eine Stunde. Der soll einmal am Tag laufen und nicht bei jedem
# Commit. Von Hand startbar über "Run workflow".
on:
  schedule:
    # Vorerst nur montags 03:15 UTC (05:15 deutscher Zeit). Der sonntägliche
    # Lauf ist damit übersprungen. Für den täglichen Rhythmus wieder auf
    # "15 3 * * *" ändern.
    - cron: "15 3 * * 1"
  workflow_dispatch:
    inputs:
      nur_veroeffentlichen:
        description: "Nur den committeten docs/-Stand veröffentlichen, nichts abrufen"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Nicht abbrechen: ein angefangener Lauf soll zu Ende gehen, sonst bleibt
  # die Seite auf einem halben Datenstand stehen.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reihenfolge nach Dauer: die kleinen Rangfolgen zuerst, der große
      # Fußball-Lauf zuletzt. Bricht er ab, steht wenigstens alles andere
      # auf frischem Stand.
      # Mit dem Schalter "nur_veroeffentlichen" wird der committete Stand aus
      # docs/ direkt veröffentlicht. Nützlich, wenn sich nur Seitenaufbau oder
      # Bilder geändert haben -- dann muss niemand eine Stunde crawlen.
      - name: Handball bauen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          python3 build.py --sport handball
          python3 build.py --sport handball-frauen

      - name: Basketball bauen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          python3 build.py --sport basketball
          python3 build.py --sport basketball-frauen

      - name: Fußball bauen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          python3 build.py --sport fussball-frauen
          python3 build.py --sport fussball

      # Die Prüfung bricht ab, wenn eine harte Prüfung fehlschlägt -- dann
      # wird nichts veröffentlicht und der Lauf ist rot.
      - name: Daten prüfen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          for s in fussball fussball-frauen handball handball-frauen \
                   basketball basketball-frauen; do
            python3 pruefen.py --sport "$s"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
