name: Ranking aktualisieren

# Bewusst KEIN push-Auslöser: ein Fußball-Lauf holt rund 3.500 Tabellen und
# dauert etwa eine Stunde. Der soll einmal am Tag laufen und nicht bei jedem
# Commit. Von Hand startbar über "Run workflow".
on:
  schedule:
    # Vorerst nur montags 03:15 UTC (05:15 deutscher Zeit). Der sonntägliche
    # Lauf ist damit übersprungen. Für den täglichen Rhythmus wieder auf
    # "15 3 * * *" ändern.
    - cron: "15 3 * * 1"
  workflow_dispatch:
    inputs:
      nur_veroeffentlichen:
        description: "Nur den committeten docs/-Stand veröffentlichen, nichts abrufen"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Nicht abbrechen: ein angefangener Lauf soll zu Ende gehen, sonst bleibt
  # die Seite auf einem halben Datenstand stehen.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artefakt: ${{ steps.hochgeladen.outputs.ja }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reihenfolge nach Dauer: die kleinen Rangfolgen zuerst, der große
      # Fußball-Lauf zuletzt. Bricht er ab, steht wenigstens alles andere
      # auf frischem Stand.
      # Mit dem Schalter "nur_veroeffentlichen" wird der committete Stand aus
      # docs/ direkt veröffentlicht. Nützlich, wenn sich nur Seitenaufbau oder
      # Bilder geändert haben -- dann muss niemand eine Stunde crawlen.
      - name: Handball bauen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          python3 build.py --sport handball
          python3 build.py --sport handball-frauen

      - name: Basketball bauen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          python3 build.py --sport basketball
          python3 build.py --sport basketball-frauen

      - name: Fußball bauen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          python3 build.py --sport fussball-frauen
          python3 build.py --sport fussball

      # Alle sechs prüfen, dann erst entscheiden. GitHub führt jeden Schritt
      # mit "bash -e" aus: ohne das "|| ..." würde die Schleife beim ersten
      # Fehlschlag abbrechen, und die dahinterliegenden Rangfolgen blieben
      # ungeprüft -- man repariert eine und findet beim nächsten Lauf die
      # nächste.
      #
      # Fällt eine Rangfolge durch, wird nur sie auf den zuletzt
      # veröffentlichten Stand zurückgesetzt; die anderen fünf gehen live.
      # Ein einzelner Verein in einer Kreisliga hat schon dreimal die
      # Veröffentlichung aller sechs Rangfolgen verhindert -- veraltet und
      # richtig ist besser als frisch und falsch, aber beides ist besser als
      # gar nichts. Der Lauf bleibt rot, damit es nicht untergeht.
      - name: Daten prüfen
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          fehler=""
          for s in fussball fussball-frauen handball handball-frauen \
                   basketball basketball-frauen; do
            if ! python3 pruefen.py --sport "$s"; then
              fehler="$fehler $s"
              git checkout -- "docs/data/$s.json" "docs/data/$s.info.json" \
                              "docs/$s-vereine.csv" "docs/$s-ligen.csv" || true
              echo "::error::$s fällt durch die Prüfung — veröffentlicht wird"\
                   " der bisherige Stand dieser Rangfolge"
            fi
          done
          python3 build.py --nur-huelle
          if [ -n "$fehler" ]; then
            echo "geprueft=$fehler" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: hochgeladen
        run: echo "ja=true" >> "$GITHUB_OUTPUT"

      # Erst veröffentlichen, dann rot werden: so steht die Seite auf dem
      # bestmöglichen Stand und der Fehlschlag ist trotzdem sichtbar.
      - name: Fehlschlag melden
        if: ${{ env.geprueft != '' }}
        run: |
          echo "::error::Harte Prüfungen fehlgeschlagen bei:$geprueft"
          exit 1

  deploy:
    needs: build
    if: ${{ always() && needs.build.outputs.artefakt == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
